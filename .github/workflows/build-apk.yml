name: Build CycloToLow Signed APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Source Project
        run: unzip -o *.zip

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Configure Android SDK Path
        run: |
          SDK_PATH="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_PATH" >> $GITHUB_ENV
          echo "sdk.dir=$SDK_PATH" > local.properties
          yes | "$SDK_PATH/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Build Unsigned Release APK
        run: gradle assembleRelease --no-daemon

      - name: Generate Keystore & Sign Release APK
        run: |
          keytool -genkey -v -keystore cyclotolow-release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias cyclotolow_key -storepass cyclotolow123 -keypass cyclotolow123 \
            -dname "CN=CycloToLow, OU=Mobile, O=CycloToLow, L=Bojonegoro, S=JawaTimur, C=ID"

          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          $BUILD_TOOLS_DIR/zipalign -v -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app-release-aligned.apk

          $BUILD_TOOLS_DIR/apksigner sign \
            --ks cyclotolow-release.jks \
            --ks-pass pass:cyclotolow123 \
            --out CycloToLow-v1.0.0-signed.apk \
            app-release-aligned.apk

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CycloToLow-v1.0.0-APK
          path: CycloToLow-v1.0.0-signed.apk
